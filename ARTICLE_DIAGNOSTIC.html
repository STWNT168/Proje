<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PMV Article Diagnostic</title><style>body{font-family:Arial,sans-serif;margin:20px;max-width:900px}button{padding:10px 14px;margin:4px}pre{white-space:pre-wrap;background:#f3f6f8;padding:12px;border-radius:8px}</style></head><body><h2>PMV Article Master Diagnostic</h2><p>This uses the same configured Apps Script endpoint and current login session.</p><button id="run">Run Diagnostic</button><pre id="out">Waiting…</pre><script src="js/config.js"></script><script src="js/api.js"></script><script>document.getElementById('run').onclick=async()=>{const o=document.getElementById('out');try{const m=await PMVApi.diagnoseMaster();const s=await PMVApi.diagnoseStatus(new Date().toISOString().slice(0,10));o.textContent=JSON.stringify({master:m,status:s},null,2)}catch(e){o.textContent=e.stack||e.message||String(e)}};</script></body></html>
