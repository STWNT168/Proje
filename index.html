<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PMV Toolkit Tracker</title><link rel="stylesheet" href="styles.css"></head><body><header>✉ PMV Toolkit Tracker <span id="who"></span><button id="logout">Logout</button></header><main>
<section id="loginView" class="card"><h1>PMV Toolkit Tracker</h1><p>Department of Posts · Udhampur Division</p><label>User ID<input id="uid"></label><label>Registered Mobile Number<input id="mobile"></label><button id="login">SIGN IN</button><p id="msg"></p></section>
<section id="spmView" class="hidden"><div class="card"><h2>SPM Daily Update</h2><label>Date<input id="spm-date" type="date"></label><p>Opening Kits: <b id="openK">0</b> · Opening Articles: <b id="openA">0</b></p></div><form id="spm-form" class="card"><div class="grid"><label>New Kits Received<input id="newKits" type="number" min="0" value="0"></label><label>New Articles Received<input id="newArticles" type="number" min="0" value="0"></label><label>Redirected Kits<input id="redirectedKits" type="number" min="0" value="0"></label><label>Redirected Articles<input id="redirectedArticles" type="number" min="0" value="0"></label><label>RTS / Returned Kits<input id="rtsKits" type="number" min="0" value="0"></label><label>RTS / Returned Articles<input id="rtsArticles" type="number" min="0" value="0"></label><label>Delivered Kits Today<input id="deliveredKits" type="number" min="0" value="0"></label><label>Delivered Articles Today<input id="deliveredArticles" type="number" min="0" value="0"></label><label>Invalid Mobile Kits<input id="invalidKits" type="number" min="0" value="0"></label><label>Invalid Mobile Articles<input id="invalidArticles" type="number" min="0" value="0"></label><label>Torn / Without Proper Details Kits<input id="tornKits" type="number" min="0" value="0"></label><label>Torn / Without Proper Details Articles<input id="tornArticles" type="number" min="0" value="0"></label><label>Deliverable Kits<input id="deliverableKits" type="number" min="0" value="0"></label><label>Deliverable Articles<input id="deliverableArticles" type="number" min="0" value="0"></label><label>Incomplete Kits<input id="incompleteKits" type="number" min="0" value="0"></label><label>Incomplete Articles<input id="incompleteArticles" type="number" min="0" value="0"></label></div><p>Closing Kits: <b id="closeK">0</b> · Closing Articles: <b id="closeA">0</b></p><p id="validation"></p><button>SUBMIT DAILY REPORT</button></form></section>
<section id="adminView" class="hidden"><div class="card"><h2>Admin / DPS Consolidated Dashboard</h2><label>Date<input id="admin-date" type="date"></label><button id="refresh">Refresh</button><p>Monitoring date: <b id="monitoring"></b></p><p id="msg"></p></div><div id="stats" class="stats"></div><div class="card"><h3>Office-wise Consolidated Report</h3><div class="scroll"><table id="office"></table></div></div><div class="card"><h3>SPMs Who Have Not Updated</h3><div class="scroll"><table id="pending"></table></div></div></section></main>
<script src="config.js"></script><script src="api.js"></script><script src="spm-dashboard.js"></script><script src="admin-dashboard.js"></script><script src="app.js"></script></body></html>
