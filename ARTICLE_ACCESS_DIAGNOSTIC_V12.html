<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PMV V12 PIN Diagnostic</title><style>body{font-family:Arial,sans-serif;background:#f3f7fa;padding:18px}button{padding:12px 18px;border:0;border-radius:7px;background:#075477;color:white}pre{background:#111;color:#0f0;padding:15px;border-radius:8px;white-space:pre-wrap;overflow:auto}</style></head><body><h2>PMV V12 Article/PIN Diagnostic</h2><p>Run this while logged into the portal. It checks USER_MASTER, OFFICE_MASTER and ARTICLE_MASTER PIN matching.</p><button id="run">RUN DIAGNOSTIC</button><pre id="out">Ready.</pre><script>document.getElementById('run').onclick=async()=>{const out=document.getElementById('out');try{const s=JSON.parse(localStorage.getItem('pmv_session_v3')||'null');if(!s)throw Error('No login session in this browser. Sign in to the portal first.');const base=prompt('Enter current Apps Script /exec URL');if(!base)return;const u=base+'?action=diagnosePinAccess&session='+encodeURIComponent(JSON.stringify(s));const r=await fetch(u,{cache:'no-store'});out.textContent=await r.text()}catch(e){out.textContent='FAILED: '+e.message}};</script></body></html>
